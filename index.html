<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<title>NEON SNAKE — Pixel Game</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #101820;
  --panel: #182630;
  --green: #70f58b;
  --green-dark: #23864b;
  --white: #e9f4ee;
  --muted: #8da49a;
  --red: #ff4b55;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--white);
  font-family: "Courier New", monospace;
  background: var(--bg);
}

.page {
  min-height: 100svh;
  overflow: hidden;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 28px 18px;
  background:
    linear-gradient(#ffffff08 1px, transparent 1px),
    linear-gradient(90deg, #ffffff08 1px, transparent 1px),
    radial-gradient(ellipse at 50% 40%, #1d3c36, #101820 72%);
  background-size: 24px 24px, 24px 24px, cover;
}

.content {
  position: relative;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  border-bottom: 2px solid #33483f;
  padding-bottom: 13px;
}

.status {
  color: var(--green);
}

.logo {
  margin: 30px 0 8px;
  color: var(--green);
  font-size: clamp(40px, 12vw, 64px);
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
  text-shadow: 4px 4px #23683e;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 3px;
  color: #a8bdb2;
}

/* Игровая пиксельная сцена */
.game {
  position: relative;
  margin: 30px auto 24px;
  width: 100%;
  max-width: 350px;
  height: 235px;
  overflow: hidden;
  border: 4px solid #466455;
  background-color: #a4d7a5;
  background-image:
    linear-gradient(#79b98766 2px, transparent 2px),
    linear-gradient(90deg, #79b98766 2px, transparent 2px);
  background-size: 20px 20px;
  box-shadow: 8px 8px 0 #090e12;
}

/* Дальние деревья */
.tree {
  position: absolute;
  bottom: 72px;
  width: 12px;
  height: 45px;
  background: #6c9e69;
  box-shadow: 0 0 0 4px #6c9e69;
}

.tree::before {
  content: "";
  position: absolute;
  left: -15px;
  top: -22px;
  width: 38px;
  height: 28px;
  background: #4b9860;
  box-shadow:
    -5px 5px #4b9860,
    8px -8px #72bd79;
}

.tree.a { left: 35px; }
.tree.b { left: 125px; transform: scale(.8); }
.tree.c { right: 42px; transform: scale(1.1); }

.cloud {
  position: absolute;
  top: 26px;
  left: 38px;
  width: 34px;
  height: 10px;
  background: #e4f2d3;
  box-shadow:
    10px -10px #e4f2d3,
    20px 0 #e4f2d3,
    10px 10px #e4f2d3;
}

.cloud.two {
  left: auto;
  right: 45px;
  top: 57px;
  transform: scale(.7);
}

/* Земля */
.ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 35px;
  background: #557d4c;
  border-top: 7px solid #70c765;
  background-image:
    linear-gradient(90deg, transparent 50%, #416740 50%);
  background-size: 20px 20px;
}

/* Змея сбоку, в стиле классических игр */
.snake-part {
  position: absolute;
  width: 32px;
  height: 32px;
  background: #32cb62;
  border: 3px solid #176a42;
  box-shadow: inset -5px -5px #23964b;
  z-index: 2;
}

.snake-1 { left: 43px; bottom: 45px; }
.snake-2 { left: 75px; bottom: 45px; }
.snake-3 { left: 107px; bottom: 45px; }
.snake-4 { left: 139px; bottom: 45px; }
.snake-5 { left: 139px; bottom: 77px; }

.snake-head {
  position: absolute;
  z-index: 3;
  left: 139px;
  bottom: 109px;
  width: 38px;
  height: 38px;
  background: #48ef73;
  border: 4px solid #176a42;
  box-shadow: inset -5px -5px #27a950;
}

.snake-head::before,
.snake-head::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 6px;
  background: #f4ffe5;
  top: 5px;
}

.snake-head::before { left: 4px; }
.snake-head::after { right: 4px; }

.eye-pupil {
  position: absolute;
  z-index: 4;
  top: 7px;
  left: 8px;
  width: 4px;
  height: 7px;
  background: #173b2b;
  box-shadow: 12px 0 #173b2b;
}

/* Яблоко на игровом поле */
.apple {
  position: absolute;
  z-index: 3;
  right: 49px;
  bottom: 45px;
  width: 22px;
  height: 22px;
  background: var(--red);
  border: 3px solid #a9253b;
  box-shadow: inset -4px -4px #d52e42;
}

.apple::before {
  content: "";
  position: absolute;
  width: 5px;
  height: 8px;
  top: -9px;
  left: 8px;
  background: #287647;
}

.apple::after {
  content: "";
  position: absolute;
  top: -7px;
  left: 12px;
  width: 8px;
  height: 4px;
  background: #69df7b;
}

.hud {
  position: absolute;
  z-index: 5;
  top: 10px;
  left: 10px;
  padding: 8px 10px;
  background: #172a25;
  border: 2px solid #47745a;
  color: #d7f8d5;
  font-size: 11px;
  font-weight: bold;
}

.hud span {
  color: #ff646b;
}

/* Нижнее меню */
.section-label {
  margin-bottom: 15px;
  color: #93b7a0;
  font-size: 10px;
  letter-spacing: 3px;
}

.buttons {
  display: grid;
  gap: 13px;
  width: 100%;
  max-width: 310px;
  margin: auto;
}

button {
  min-height: 58px;
  width: 100%;
  border: 3px solid #a0ffad;
  border-radius: 0;
  background: var(--green);
  color: #10271a;
  font-family: inherit;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 2px;
  box-shadow: 5px 5px 0 #286541;
  cursor: pointer;
}

button.secondary {
  background: #192b30;
  border-color: #4f7863;
  color: #c4e5ce;
  box-shadow: 5px 5px 0 #0a1116;
}

button:active {
  transform: translate(3px, 3px);
  box-shadow: 2px 2px 0 #286541;
}

.footer {
  margin-top: 28px;
  padding-top: 15px;
  border-top: 2px solid #2b4038;
  color: #789286;
  font-size: 10px;
  line-height: 2;
  letter-spacing: 2px;
}

.footer strong {
  color: var(--green);
}

@media (max-height: 740px) {
  .page { padding-top: 18px; padding-bottom: 18px; }
  .logo { margin-top: 20px; }
  .game { margin-top: 20px; margin-bottom: 20px; }
  .footer { margin-top: 20px; }
}
</style>
</head>

<body>
<div class="page">
  <main class="content">

    <div class="topline">
      <span>PIXEL STUDIOS</span>
      <span class="status">● SYSTEM READY</span>
    </div>

    <h1 class="logo">SNAKE<span style="color:#f5f7e9">.</span></h1>
    <div class="subtitle">CLASSIC ARCADE EXPERIENCE</div>

    <div class="game">
      <div class="hud"> <span>♥</span>  SCORE: 010 </div>

      <div class="cloud"></div>
      <div class="cloud two"></div>

      <div class="tree a"></div>
      <div class="tree b"></div>
      <div class="tree c"></div>

      <div class="snake-part snake-1"></div>
      <div class="snake-part snake-2"></div>
      <div class="snake-part snake-3"></div>
      <div class="snake-part snake-4"></div>
      <div class="snake-part snake-5"></div>
      <div class="snake-head">
        <div class="eye-pupil"></div>
      </div>

      <div class="apple"></div>
      <div class="ground"></div>
    </div>

    <div class="section-label">— MAIN MENU —</div>

    <div class="buttons">
      <button>▶ &nbsp; PLAY GAME</button>
      <button class="secondary">▣ &nbsp; PROFILE</button>
    </div>

    <div class="footer">
      BUILT FOR THE <strong>PIXEL GENERATION</strong>
      <br>
      VERSION 1.0.0 · 2026
    </div>

  </main>
</div>
</body>
</html>
